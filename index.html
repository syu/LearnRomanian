<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><!-- Google TTS refuses requests that carry a Referer -->
<title>Învățăm română</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1c2333; --muted: #6a7286; --line: #e2e5ee;
    --blue: #1f4fbf; --blue-soft: #e9effd; --ok: #1d9a52; --ok-soft: #e2f5e9;
    --bad: #d33f3f; --bad-soft: #fde7e7; --warm: #c45a00; --warm-soft: #fff0e1;
    --cold: #1d6fb8; --cold-soft: #e3f1fc;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(20,30,60,.06);
    --r: 14px;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131a; --card: #1a1f2a; --text: #e8ebf2; --muted: #9aa3b5; --line: #2c3343;
      --blue: #86a8ff; --blue-soft: #1f2a45; --ok: #4fca86; --ok-soft: #16301f;
      --bad: #ff7d7d; --bad-soft: #3a1c21; --warm: #ffae63; --warm-soft: #3a2614;
      --cold: #7cc0ff; --cold-soft: #15293d; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 48px; }
  .muted { color: var(--muted); }

  /* ---------- home ---------- */
  .top { display: flex; align-items: center; gap: 12px; margin: 8px 0 8px; }
  .flag { display: inline-flex; width: 30px; height: 20px; border-radius: 3px; overflow: hidden; flex: none; }
  .flag i { flex: 1; }
  h1 { font-size: 24px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    margin: 26px 0 10px; font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: var(--card); padding: 8px 14px;
    border-radius: 999px; display: inline-flex; gap: 8px; align-items: baseline; }
  .chip.on { border-color: var(--blue); background: var(--blue-soft); }
  .chip .sub { color: var(--muted); font-size: 14px; }
  .chip .n { font-size: 12px; font-weight: 700; color: var(--blue); }
  .modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
  .mode { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r);
    padding: 14px; text-align: left; box-shadow: var(--shadow); transition: transform .08s, border-color .15s; }
  .mode:hover { border-color: var(--blue); transform: translateY(-1px); }
  .mode:disabled { opacity: .45; pointer-events: none; }
  .mode .ic { font: 26px var(--emoji); }
  .mode b { display: block; margin-top: 6px; }
  .mode span { color: var(--muted); font-size: 13px; }
  .modes .group { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .set { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .set.row { flex-direction: row; align-items: center; gap: 10px; color: var(--text); }
  .set.row input { width: 18px; height: 18px; }
  select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  .voice-info { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 10px;
    align-items: center; flex-wrap: wrap; }

  /* ---------- common buttons ---------- */
  .btn { border: 1.5px solid var(--line); background: var(--card); padding: 10px 18px; border-radius: 12px; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .spk { border: none; background: var(--blue-soft); color: var(--blue); width: 38px; height: 38px;
    border-radius: 50%; font: 18px var(--emoji); display: inline-grid; place-items: center; flex: none;
    vertical-align: middle; }
  .spk:hover { filter: brightness(.95); }
  .spk.big { width: 88px; height: 88px; font-size: 40px; }

  /* ---------- pictures ---------- */
  .pic { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .pic .emo { font: 54px/1.1 var(--emoji); white-space: nowrap; }
  .pic img { max-width: 100%; max-height: 120px; border-radius: 10px; object-fit: cover; }
  .pic .tag { font-size: 13px; font-weight: 700; padding: 1px 9px; border-radius: 999px;
    background: var(--blue-soft); color: var(--blue); }
  .pic .tag.warm { background: var(--warm-soft); color: var(--warm); }
  .pic .tag.cold { background: var(--cold-soft); color: var(--cold); }
  .pic.lg .emo { font-size: 92px; }
  .pic.lg img { max-height: 200px; }
  .pic.sm .emo { font-size: 34px; }
  .pic.sm .tag { font-size: 11px; }
  .pic.xs .emo { font-size: 32px; }
  .pic.xs .tag { display: none; }

  /* ---------- quiz ---------- */
  .qbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .x { border: none; background: none; font-size: 22px; color: var(--muted); padding: 4px 8px; }
  .prog { flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .3s; }
  .score { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .score .o { color: var(--ok); } .score .b { color: var(--bad); margin-left: 8px; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
  .qcard { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line);
    padding: 26px 16px; text-align: center; min-height: 170px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; }
  .qword { font-size: 38px; font-weight: 700; display: flex; align-items: center; gap: 12px;
    justify-content: center; flex-wrap: wrap; }
  .qword.ru { font-size: 32px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .opt { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: var(--r);
    padding: 16px 14px 16px 36px; font-size: 19px; text-align: left; min-height: 64px; box-shadow: var(--shadow);
    transition: border-color .12s, background .12s; }
  .opt:hover:not(:disabled) { border-color: var(--blue); }
  .opt .k { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--muted); font-weight: 700; }
  .opts.pics .opt { padding: 18px 8px 14px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; min-height: 150px; text-align: center; }
  .opt .cap { font-size: 17px; line-height: 1.25; }
  .opts.pics { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt:disabled { cursor: default; }
  .opt.dim { opacity: .5; }
  .after { margin-top: 14px; min-height: 60px; }
  .reveal { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--r);
    background: var(--card); border: 1px solid var(--line); flex-wrap: wrap; }
  .reveal .verdict { font-weight: 700; }
  .reveal.ok .verdict { color: var(--ok); } .reveal.bad .verdict { color: var(--bad); }
  .reveal .info { flex: 1; min-width: 200px; }
  .reveal .ex, .card .ex { font-size: 14px; color: var(--muted); cursor: pointer; }
  .reveal .ex:hover, .card .ex:hover { color: var(--blue); }
  .tr { color: var(--muted); font-size: 14px; font-weight: 400; }
  .nextrow { display: flex; justify-content: flex-end; margin-top: 10px; gap: 10px; align-items: center; }
  .keys { font-size: 12px; color: var(--muted); margin-right: auto; }

  /* ---------- match ---------- */
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .mi { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px;
    min-height: 62px; font-size: 18px; box-shadow: var(--shadow); transition: all .15s; }
  .mi.p { padding: 6px 10px; }
  .mi .pr { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .mi:hover { border-color: var(--blue); }
  .mi.sel { border-color: var(--blue); background: var(--blue-soft); }
  .mi.done { border-color: var(--ok); background: var(--ok-soft); opacity: .45; pointer-events: none; }
  .mi.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* ---------- cards ---------- */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .btn.on { border-color: var(--blue); background: var(--blue-soft); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .card .pic { min-height: 90px; }
  .card .cro { font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card .cru { font-size: 16px; }
  .card .note { font-size: 13px; color: var(--muted); }
  .card .st { font-size: 12px; color: var(--muted); }
  .hidden-txt { filter: blur(7px); cursor: pointer; user-select: none; }

  /* ---------- results ---------- */
  .res { text-align: center; }
  .res .big { font: 64px var(--emoji); }
  .res h1 { font-size: 40px; }
  .mlist { display: flex; flex-direction: column; gap: 8px; text-align: left; margin: 0 auto; max-width: 520px; }
  .mrow { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; }
  .mrow .w { flex: 1; } .mrow b { font-size: 18px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 520px) {
    .qword { font-size: 30px; } .qword.ru { font-size: 26px; }
    .opts { grid-template-columns: 1fr; }
    .opts.pics { grid-template-columns: 1fr 1fr; }
    .opts.pics .opt { min-height: 120px; }
    .pic .emo { font-size: 44px; } .pic.lg .emo { font-size: 76px; }
    .mi { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
'use strict';

/* ================= helpers ================= */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickRandom = a => a[Math.random() * a.length | 0];
const LS = {
  get(k, d) { try { const v = localStorage.getItem('learnro.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('learnro.' + k, JSON.stringify(v)); } catch (e) {} },
};
let toastTimer;
function toast(msg, ms = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= data ================= */
const TOPICS = (window.TOPICS || []).map(t => ({
  ...t, words: t.words.map(w => ({ ...w, topic: t.id, key: t.id + '|' + w.ro })),
}));
const ALL = TOPICS.flatMap(t => t.words);

const settings = Object.assign(
  { options: 4, length: 'all', autoplay: true, autonext: true, voice: 'auto', rate: 0.85 },
  LS.get('settings', {})
);
let selected = LS.get('topics', []).filter(id => TOPICS.some(t => t.id === id));
if (!selected.length && TOPICS.length) selected = [TOPICS[0].id];
const stats = LS.get('stats', {});

const saveSettings = () => LS.set('settings', settings);
const selectedWords = () => TOPICS.filter(t => selected.includes(t.id)).flatMap(t => t.words);
function record(w, ok) {
  const s = stats[w.key] || (stats[w.key] = { c: 0, w: 0 });
  ok ? s.c++ : s.w++;
  LS.set('stats', stats);
}

/* ================= speech ================= */
const Speech = {
  voices: [],
  audio: null,
  load() {
    if (!('speechSynthesis' in window)) return;
    this.voices = speechSynthesis.getVoices().filter(v => /^ro([-_]|$)/i.test(v.lang));
    // female first, then natural/online voices first
    const rank = v => (this.isFemale(v) ? 2 : 0) + (/natural|online/i.test(v.name) ? 1 : 0);
    this.voices.sort((a, b) => rank(b) - rank(a));
    if (screen === 'home') renderVoiceUI();
  },
  isFemale: v => /alina|ioana|elena|carmen|maria|female|woman/i.test(v.name),
  isMale: v => /andrei|emil|male/i.test(v.name) && !/female/i.test(v.name),
  engine() {
    if (settings.voice === 'google') return 'google';
    if (settings.voice !== 'auto') {
      const v = this.voices.find(v => v.name === settings.voice);
      if (v) return v;
    }
    // Auto: a female system voice if there is one, otherwise Google (also a female voice)
    return this.voices.find(v => this.isFemale(v)) || 'google';
  },
  say(item) {
    if (!item) return;
    if (item.audio) { this.playUrl(item.audio, item.ro); return; }
    const text = item.ro;
    const e = this.engine();
    if (e === 'google') { this.google(text); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = e; u.lang = e.lang; u.rate = settings.rate;
    speechSynthesis.speak(u);
  },
  google(text) {
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ro&q=' + encodeURIComponent(text);
    this.playUrl(url, text, settings.rate);
  },
  playUrl(url, text, rate = 1) {
    if (this.audio) this.audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const a = this.audio = new Audio(url);
    a.playbackRate = Math.max(rate, 0.7);
    a.play().catch(() => {
      // last resort: browser default voice with Romanian language tag
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ro-RO'; u.rate = settings.rate;
        speechSynthesis.speak(u);
      }
      toast('Не удалось загрузить звук. Нужен интернет или румынский голос в системе (см. настройки).');
    });
  },
};
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => Speech.load();
}

/* Speaker buttons: render with sayBtn(), activate with bindSay() after innerHTML. */
let sayRegistry = [];
function sayBtn(item, cls = '') {
  sayRegistry.push(item);
  return `<button class="spk ${cls}" data-say="${sayRegistry.length - 1}" title="Послушать" aria-label="Послушать">🔊</button>`;
}
function bindSay() {
  app.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); Speech.say(sayRegistry[+b.dataset.say]);
  }));
}
function setHTML(html) { app.innerHTML = html; bindSay(); }

/* ================= pictures ================= */
const hasPic = w => !!(w.pic || w.img);
function picHTML(w, size = '') {
  if (!hasPic(w)) return '';
  let tag = '';
  if (w.tag) {
    const t = String(w.tag).trim();
    const cls = /^[−-]/.test(t) || /^\+?[0-5]°/.test(t) ? 'cold' : /^\+/.test(t) ? 'warm' : '';
    tag = `<span class="tag ${cls}">${esc(t)}</span>`;
  }
  const body = w.img ? `<img src="${esc(w.img)}" alt="">` : `<span class="emo">${esc(w.pic)}</span>`;
  return `<div class="pic ${size}">${body}${tag}</div>`;
}

/* ================= modes ================= */
const QUIZ_TYPES = ['ro-ru', 'ru-ro', 'audio-ru', 'ro-pic', 'pic-ro'];
// question type for "mix": words without a picture skip the picture types
const mixType = w => pickRandom(hasPic(w) ? QUIZ_TYPES : QUIZ_TYPES.filter(t => t !== 'ro-pic' && t !== 'pic-ro'));
// same synonym group (syn) — never offered together as options or in one pairs round
const sameSyn = (a, b) => !!(a.syn && a.syn === b.syn);
const MODES = [
  { group: 'Изучение' },
  { id: 'cards', ic: '📖', name: 'Карточки', desc: 'Посмотреть, послушать, проверить себя' },
  { group: 'Перевод' },
  { id: 'ro-ru', ic: '🔤', name: 'RO → RU', desc: 'Выбрать перевод слова' },
  { id: 'ru-ro', ic: '🔁', name: 'RU → RO', desc: 'Выбрать румынское слово' },
  { id: 'audio-ru', ic: '🎧', name: 'На слух', desc: 'Услышать и выбрать перевод' },
  { group: 'С картинками' },
  { id: 'ro-pic', ic: '🖼️', name: 'RO → картинка', desc: 'Перевод с картинкой-подсказкой' },
  { id: 'pic-ro', ic: '🔍', name: 'Картинка → RO', desc: 'Картинка с переводом → румынское слово' },
  { group: 'Пары' },
  { id: 'match-ru', ic: '🧩', name: 'Слово — перевод', desc: 'Соединить пары из двух списков' },
  { id: 'match-pic', ic: '🧩', name: 'Слово — картинка', desc: 'Пары: слово и картинка с переводом' },
  { group: 'Всё вместе' },
  { id: 'mix', ic: '🎲', name: 'Микс', desc: 'Все типы вопросов вперемешку' },
];
const PROMPTS = {
  'ro-ru': 'Выберите перевод',
  'ru-ro': 'Выберите румынское слово',
  'audio-ru': 'Послушайте и выберите перевод',
  'ro-pic': 'Выберите перевод',
  'pic-ro': 'Выберите румынское слово',
};

let screen = 'home';
let last = null;   // { mode, words } — for "again" / "retry mistakes"

/* ================= home ================= */
function renderHome() {
  screen = 'home';
  sayRegistry = [];
  const sel = selectedWords();
  const allOn = selected.length === TOPICS.length;
  const opt = (v, cur, label) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${label}</option>`;
  setHTML(`
    <header class="top">
      <span class="flag"><i style="background:#002B7F"></i><i style="background:#FCD116"></i><i style="background:#CE1126"></i></span>
      <h1>Învățăm cuvinte</h1>
    </header>
    <div class="muted">Учим румынские слова: перевод, картинки, пары и произношение.</div>

    <h2>Темы</h2>
    <div class="chips">
      ${TOPICS.length > 1 ? `<button class="chip ${allOn ? 'on' : ''}" data-all>Все темы <span class="n">${ALL.length}</span></button>` : ''}
      ${TOPICS.map(t => `<button class="chip ${selected.includes(t.id) ? 'on' : ''}" data-topic="${esc(t.id)}">
        ${esc(t.name)} <span class="sub">${esc(t.ru || '')}</span> <span class="n">${t.words.length}</span></button>`).join('')}
    </div>
    <p class="muted" style="font-size:14px">Выбрано слов: <b>${sel.length}</b></p>

    <h2>Как учить</h2>
    <div class="modes">
      ${MODES.map(m => m.group ? `<div class="group">${m.group}</div>` :
        `<button class="mode" data-mode="${m.id}" ${sel.length < 2 ? 'disabled' : ''}>
          <div class="ic">${m.ic}</div><b>${m.name}</b><span>${m.desc}</span></button>`).join('')}
    </div>

    <h2>Настройки</h2>
    <div class="settings">
      <label class="set">Вариантов ответа
        <select data-set="options">${[3, 4, 6].map(n => opt(n, settings.options, n)).join('')}</select></label>
      <label class="set">Слов за занятие
        <select data-set="length">${opt(10, settings.length, '10')}${opt(20, settings.length, '20')}${opt('all', settings.length, 'Все выбранные')}</select></label>
      <label class="set">Голос
        <select data-set="voice" id="voiceSel"></select></label>
      <label class="set">Скорость речи
        <select data-set="rate">${opt(0.7, settings.rate, 'Медленно')}${opt(0.85, settings.rate, 'Спокойно')}${opt(1, settings.rate, 'Обычно')}</select></label>
      <label class="set row"><input type="checkbox" data-set="autoplay" ${settings.autoplay ? 'checked' : ''}> Автоматически произносить слова</label>
      <label class="set row"><input type="checkbox" data-set="autonext" ${settings.autonext ? 'checked' : ''}> Переходить дальше после верного ответа</label>
      <div class="voice-info"><span id="voiceInfo"></span>
        <button class="btn small" id="testVoice">🔊 Проверить: «Afară plouă»</button></div>
    </div>
  `);
  renderVoiceUI();

  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
    const id = b.dataset.topic;
    selected = selected.includes(id) ? selected.filter(x => x !== id) : [...selected, id];
    LS.set('topics', selected); renderHome();
  });
  const all = app.querySelector('[data-all]');
  if (all) all.onclick = () => {
    selected = allOn ? [TOPICS[0].id] : TOPICS.map(t => t.id);
    LS.set('topics', selected); renderHome();
  };
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => startMode(b.dataset.mode, sessionWords()));
  app.querySelectorAll('[data-set]').forEach(el => el.onchange = () => {
    const k = el.dataset.set;
    settings[k] = el.type === 'checkbox' ? el.checked
      : (k === 'options' || k === 'rate') ? +el.value
      : k === 'length' && el.value !== 'all' ? +el.value : el.value;
    saveSettings();
    if (k === 'voice') renderVoiceUI();
  });
  app.querySelector('#testVoice').onclick = () => Speech.say({ ro: 'Afară plouă.' });
}

function renderVoiceUI() {
  const sel = document.getElementById('voiceSel');
  const info = document.getElementById('voiceInfo');
  if (!sel) return;
  const o = (v, label) => `<option value="${esc(v)}" ${settings.voice === v ? 'selected' : ''}>${esc(label)}</option>`;
  const gender = v => Speech.isFemale(v) ? '♀ ' : Speech.isMale(v) ? '♂ ' : '';
  sel.innerHTML = o('auto', 'Авто (женский)') + Speech.voices.map(v => o(v.name, gender(v) + v.name)).join('')
    + o('google', '♀ Google Translate (онлайн)');
  const e = Speech.engine();
  info.textContent = e === 'google'
    ? 'Голос: Google Translate, женский (нужен интернет). Самый естественный женский голос — «Alina (Natural)» в браузере Microsoft Edge.'
    : 'Голос: ' + gender(e) + e.name;
}

function sessionWords(words = selectedWords()) {
  // Words with more mistakes come earlier (weighted random order).
  const keyed = words.map(w => {
    const s = stats[w.key] || { c: 0, w: 0 };
    const weight = 1 + 3 * s.w / (1 + s.c);
    return { w, k: Math.pow(Math.random(), 1 / weight) };
  }).sort((a, b) => b.k - a.k).map(x => x.w);
  const n = settings.length === 'all' ? keyed.length : Math.min(+settings.length, keyed.length);
  return shuffle(keyed.slice(0, n));
}

function startMode(mode, words) {
  if (!words.length) return;
  last = { mode, words };
  if (mode === 'cards') return renderCards(words);
  if (mode === 'match-ru' || mode === 'match-pic') return startMatch(mode, words);
  startQuiz(mode, words);
}

/* ================= quiz ================= */
let Q = null;

function startQuiz(mode, words) {
  const pool = selectedWords();
  Q = {
    mode, words, pool,
    queue: words.map(w => ({ w, type: mode === 'mix' ? mixType(w) : mode })),
    i: 0, ok: 0, bad: 0, firstOk: 0,
    seen: new Set(), mistakes: new Set(), retries: new Map(),
    answered: false, timer: null,
  };
  screen = 'quiz';
  renderQuestion();
}

function buildOptions(w, type) {
  const n = settings.options;
  const isPic = type === 'ro-pic' || type === 'pic-ro';
  const okCand = c => c !== w && c.ro !== w.ro && c.ru !== w.ru && !sameSyn(c, w) &&
    !(isPic && ((w.grp && c.grp === w.grp) || (hasPic(w) && c.pic === w.pic && !c.img)));
  let cand = shuffle(Q.pool.filter(okCand));
  if (cand.length < n - 1) cand = cand.concat(shuffle(ALL.filter(c => okCand(c) && !cand.includes(c))));
  return shuffle([w, ...cand.slice(0, n - 1)]);
}

function topBar(progress, ok, bad) {
  return `<div class="qbar">
    <button class="x" data-act="menu" title="В меню (Esc)">✕</button>
    <div class="prog"><i style="width:${Math.round(progress * 100)}%"></i></div>
    <div class="score"><span class="o">✓ ${ok}</span><span class="b">✗ ${bad}</span></div>
  </div>`;
}

function renderQuestion() {
  clearTimeout(Q.timer);
  sayRegistry = [];
  const item = Q.queue[Q.i];
  const { w, type } = item;
  item.opts = item.opts || buildOptions(w, type);
  Q.answered = false;

  let prompt = '';
  if (type === 'ro-ru' || type === 'ro-pic') prompt = `<div class="qword">${esc(w.ro)} ${sayBtn(w)}</div>`;
  else if (type === 'ru-ro') prompt = `<div class="qword ru">${esc(w.ru)}</div>`;
  else if (type === 'pic-ro') prompt = `${picHTML(w, 'lg')}<div class="qword ru">${esc(w.ru)}</div>`;
  else if (type === 'audio-ru') prompt = sayBtn(w, 'big');

  const isPicOpts = type === 'ro-pic';
  const optLabel = o => type === 'ro-pic' ? `${picHTML(o)}<span class="cap">${esc(o.ru)}</span>` : (type === 'ru-ro' || type === 'pic-ro') ? esc(o.ro) : esc(o.ru);

  setHTML(`
    ${topBar(Q.i / Q.queue.length, Q.ok, Q.bad)}
    <div class="hint">${PROMPTS[type]}</div>
    <div class="qcard">${prompt}</div>
    <div class="opts ${isPicOpts ? 'pics' : ''}">
      ${item.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span>${optLabel(o)}</button>`).join('')}
    </div>
    <div class="after" id="after"></div>
  `);
  app.querySelector('[data-act=menu]').onclick = renderHome;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));

  if (settings.autoplay && (type === 'ro-ru' || type === 'ro-pic' || type === 'audio-ru')) {
    setTimeout(() => Speech.say(w), 150);
  }
}

function answer(idx) {
  if (Q.answered) return;
  const item = Q.queue[Q.i];
  const { w, type } = item;
  const chosen = item.opts[idx];
  if (!chosen) return;
  Q.answered = true;
  const ok = chosen === w;

  app.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (item.opts[i] === w) b.classList.add('right');
    else if (i === idx) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const first = !Q.seen.has(w.key);
  Q.seen.add(w.key);
  record(w, ok);
  if (ok) { Q.ok++; if (first) Q.firstOk++; }
  else {
    Q.bad++; Q.mistakes.add(w);
    const r = Q.retries.get(w.key) || 0;
    if (r < 2) {   // ask this word again a bit later
      Q.retries.set(w.key, r + 1);
      const pos = Math.min(Q.queue.length, Q.i + 3 + (Math.random() * 3 | 0));
      Q.queue.splice(pos, 0, { w, type: Q.mode === 'mix' ? mixType(w) : type });
    }
  }
  app.querySelector('.score').innerHTML = `<span class="o">✓ ${Q.ok}</span><span class="b">✗ ${Q.bad}</span>`;

  if (settings.autoplay && (type === 'ru-ro' || type === 'pic-ro' || !ok)) Speech.say(w);

  const after = document.getElementById('after');
  after.innerHTML = `
    <div class="reveal ${ok ? 'ok' : 'bad'}">
      ${picHTML(w, 'sm')}
      <div class="info">
        <div class="verdict">${ok ? 'Верно!' : 'Неверно'}</div>
        <div><b>${esc(w.ro)}</b> ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''} — ${esc(w.ru)}</div>
        ${w.note ? `<div class="tr">${esc(w.note)}</div>` : ''}
        ${w.ex ? `<div class="ex" data-ex title="Послушать пример">🔊 ${esc(w.ex)} — ${esc(w.exRu || '')}</div>` : ''}
      </div>
      ${sayBtn(w)}
    </div>
    <div class="nextrow">
      <span class="keys">Клавиши: 1–${item.opts.length} — ответ, Enter — дальше, R — повторить звук</span>
      <button class="btn primary" data-act="next">Дальше →</button>
    </div>`;
  bindSay();
  const ex = after.querySelector('[data-ex]');
  if (ex) ex.onclick = () => Speech.say({ ro: w.ex });
  after.querySelector('[data-act=next]').onclick = nextQuestion;
  if (ok && settings.autonext) Q.timer = setTimeout(nextQuestion, 1300);
}

function nextQuestion() {
  if (screen !== 'quiz' || !Q.answered) return;
  clearTimeout(Q.timer);
  Q.i++;
  if (Q.i >= Q.queue.length) {
    renderResults({ good: Q.firstOk, total: Q.words.length, mistakes: [...Q.mistakes], unit: 'с первой попытки' });
  } else renderQuestion();
}

/* ================= match ================= */
let M = null;

function startMatch(mode, words) {
  const kind = mode === 'match-pic' ? 'pic' : 'ru';
  const size = window.innerWidth < 520 ? 5 : 6;
  const target = Math.ceil(words.length / Math.ceil(words.length / size));
  // split into rounds; with pictures, keep look-alike words (same grp) in different rounds
  const chunks = [];
  for (const w of words) {
    let c = chunks.find(c => c.length < target &&
      !(kind === 'pic' && w.grp && c.some(x => x.grp === w.grp)) &&
      !c.some(x => x.ru === w.ru || sameSyn(x, w)));
    if (!c) { c = []; chunks.push(c); }
    c.push(w);
  }
  M = { mode, kind, words, chunks, ci: 0, ok: 0, bad: 0, mistakes: new Set() };
  screen = 'match';
  renderMatch();
}

function renderMatch() {
  sayRegistry = [];
  const ch = M.chunks[M.ci];
  const left = shuffle(ch), right = shuffle(ch);
  const done = new Set();
  let sel = null;
  const progress = M.chunks.slice(0, M.ci).reduce((s, c) => s + c.length, 0) / M.words.length;

  setHTML(`
    ${topBar(progress, M.ok, M.bad)}
    <div class="hint">Соедините пары · раунд ${M.ci + 1} из ${M.chunks.length}</div>
    <div class="match">
      <div class="col">${left.map((w, i) => `<button class="mi" data-side="L" data-i="${i}">${esc(w.ro)}</button>`).join('')}</div>
      <div class="col">${right.map((w, i) => `<button class="mi ${M.kind === 'pic' ? 'p' : ''}" data-side="R" data-i="${i}">${
        M.kind === 'pic' ? `<span class="pr">${picHTML(w, 'xs')}<span>${esc(w.ru)}</span></span>` : esc(w.ru)}</button>`).join('')}</div>
    </div>
  `);
  app.querySelector('[data-act=menu]').onclick = renderHome;

  app.querySelectorAll('.mi').forEach(el => el.onclick = () => {
    const side = el.dataset.side;
    const w = (side === 'L' ? left : right)[+el.dataset.i];
    if (done.has(w)) return;
    if (side === 'L' && settings.autoplay) Speech.say(w);
    if (!sel || sel.side === side) {
      if (sel) sel.el.classList.remove('sel');
      sel = { side, el, w };
      el.classList.add('sel');
      return;
    }
    const a = sel; sel = null;
    a.el.classList.remove('sel');
    if (a.w === w) {
      done.add(w);
      a.el.classList.add('done'); el.classList.add('done');
      M.ok++;
      if (!M.mistakes.has(w)) record(w, true);
      if (done.size === ch.length) setTimeout(() => {
        if (screen !== 'match') return;
        M.ci++;
        if (M.ci < M.chunks.length) renderMatch();
        else renderResults({ good: M.words.length - M.mistakes.size, total: M.words.length,
          mistakes: [...M.mistakes], unit: 'без ошибок' });
      }, 600);
    } else {
      M.bad++;
      const lw = side === 'L' ? w : a.w;   // the Romanian word that was mismatched
      if (!M.mistakes.has(lw)) record(lw, false);
      M.mistakes.add(lw);
      [a.el, el].forEach(e => { e.classList.add('wrong'); setTimeout(() => e.classList.remove('wrong'), 450); });
    }
    app.querySelector('.score').innerHTML = `<span class="o">✓ ${M.ok}</span><span class="b">✗ ${M.bad}</span>`;
  });
}

/* ================= cards ================= */
let cardHide = LS.get('cardHide', 'none');   // 'none' | 'ru' | 'ro'

function renderCards(words) {
  screen = 'cards';
  sayRegistry = [];
  const sorted = words.slice().sort((a, b) => selectedWords().indexOf(a) - selectedWords().indexOf(b));
  const tbtn = (v, label) => `<button class="btn small ${cardHide === v ? 'on' : ''}" data-hide="${v}">${label}</button>`;
  setHTML(`
    <div class="qbar"><button class="x" data-act="menu" title="В меню">✕</button>
      <h1 style="font-size:20px;flex:1">Карточки · ${sorted.length}</h1></div>
    <div class="toolbar">
      ${tbtn('none', 'Показать всё')}${tbtn('ru', 'Скрыть перевод')}${tbtn('ro', 'Скрыть румынский')}
      <span class="muted" style="font-size:13px;align-self:center">Нажмите на размытый текст, чтобы открыть</span>
    </div>
    <div class="cards">
      ${sorted.map((w, i) => {
        const s = stats[w.key];
        return `<div class="card">
          ${picHTML(w)}
          <div class="cro"><span class="${cardHide === 'ro' ? 'hidden-txt' : ''}">${esc(w.ro)}
            ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''}</span>${sayBtn(w)}</div>
          <div class="cru ${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.ru)}</div>
          ${w.note ? `<div class="note ${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.note)}</div>` : ''}
          ${w.ex ? `<div class="ex" data-ex="${i}">🔊 ${esc(w.ex)}<br><span class="${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.exRu || '')}</span></div>` : ''}
          ${s ? `<div class="st">✓ ${s.c} · ✗ ${s.w}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `);
  app.querySelector('[data-act=menu]').onclick = renderHome;
  app.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => {
    cardHide = b.dataset.hide; LS.set('cardHide', cardHide); renderCards(words);
  });
  app.querySelectorAll('.hidden-txt').forEach(el => el.onclick = e => { e.stopPropagation(); el.classList.remove('hidden-txt'); });
  app.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => Speech.say({ ro: sorted[+el.dataset.ex].ex }));
}

/* ================= results ================= */
function renderResults(r) {
  screen = 'results';
  sayRegistry = [];
  const pct = r.total ? Math.round(r.good / r.total * 100) : 0;
  const emoji = pct === 100 ? '🏆' : pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '💪';
  setHTML(`
    <div class="res">
      <div class="big">${emoji}</div>
      <h1>${pct}%</h1>
      <p class="muted">${r.good} из ${r.total} ${r.unit}</p>
      ${r.mistakes.length ? `<h2>Стоит повторить</h2><div class="mlist">
        ${r.mistakes.map(w => `<div class="mrow">${picHTML(w, 'xs')}
          <div class="w"><b>${esc(w.ro)}</b> ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''}<br>
          <span class="muted">${esc(w.ru)}</span></div>${sayBtn(w)}</div>`).join('')}
      </div>` : '<p>Без единой ошибки! 👏</p>'}
      <div class="btns">
        ${r.mistakes.length ? '<button class="btn primary" data-act="retry">Повторить ошибки</button>' : ''}
        <button class="btn ${r.mistakes.length ? '' : 'primary'}" data-act="again">Ещё раз</button>
        <button class="btn" data-act="menu">В меню</button>
      </div>
    </div>
  `);
  app.querySelector('[data-act=menu]').onclick = renderHome;
  app.querySelector('[data-act=again]').onclick = () => startMode(last.mode, shuffle(last.words));
  const retry = app.querySelector('[data-act=retry]');
  if (retry) retry.onclick = () => {
    // matching needs at least 2 pairs, so pad with random words if only one mistake
    let ws = r.mistakes.slice();
    if (ws.length < 2) ws = ws.concat(shuffle(last.words.filter(w => !ws.includes(w))).slice(0, 3));
    startMode(last.mode, shuffle(ws));
  };
}

/* ================= keyboard ================= */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && screen !== 'home') { renderHome(); return; }
  if (screen !== 'quiz') return;
  const item = Q.queue[Q.i];
  if (/^[1-9]$/.test(e.key) && !Q.answered) { answer(+e.key - 1); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && Q.answered) { nextQuestion(); e.preventDefault(); }
  else if (e.code === 'KeyR') Speech.say(item.w);
});

Speech.load();
renderHome();
</script>
</body>
</html>
