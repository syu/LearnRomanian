<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><!-- Google TTS refuses requests that carry a Referer -->
<meta name="color-scheme" content="light">
<title>Învățăm cuvinte</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --rail: #0e4f55; --rail-deep: #0a3e43; --rail-line: rgba(255,255,255,.14);
    --rail-ink: #ffffff; --rail-muted: rgba(255,255,255,.74);
    --page: #f4fbf9; --paper: #ffffff; --ink: #14262b; --muted: #52676b;
    --line: #d8e9e5; --line-strong: #b9d5cf;
    --teal: #155e63; --teal-soft: #dcf0eb; --teal-ring: #5fb3ad;
    --brick: #c0412a; --brick-soft: #fbe7e1;
    --lavender: #cbb8f0; --apricot: #ffc8a2; --pistachio: #cfe8a9; --lemon: #fff1a8; --lime: #e4f09b; --mint: #bfe6dc; --sky: #b8dcf6;
    --word: "Rubik", system-ui, sans-serif;
    --ui: "Golos Text", system-ui, sans-serif;
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    --r-sm: 10px; --r: 16px; --r-lg: 24px;
    --lift: 0 6px 18px -8px rgba(14, 79, 85, .35);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line-strong) transparent; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 var(--ui);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--lemon); color: var(--ink); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--teal-ring); outline-offset: 2px; border-radius: 6px; }
  kbd { font: 600 12px var(--ui); padding: 1px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .9; }
  .ico { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
  .rail { background: var(--rail); color: var(--rail-ink); padding: 32px 22px 24px; display: flex;
    flex-direction: column; gap: 26px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    scrollbar-color: rgba(255,255,255,.25) transparent; }
  .rail :focus-visible { outline-color: var(--lemon); }
  .brand { display: block; border: none; background: none; padding: 0; text-align: left; color: inherit; }
  .brand b { display: block; font: 800 27px/1.02 var(--word); letter-spacing: -.01em; }
  .brand small { display: block; margin-top: 8px; font-size: 13px; color: var(--rail-muted); }
  .rail .label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--rail-muted); margin: 0 0 8px 10px; }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .rbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 14px;
    border-radius: var(--r-sm); border: 1.5px solid var(--rail-line); background: transparent; color: var(--rail-ink);
    font-weight: 600; transition: background .2s, border-color .2s; }
  .rbtn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.4); }
  .rbtn.on { background: var(--lemon); border-color: var(--lemon); color: var(--ink); }
  .rnote { font-size: 13px; color: var(--rail-muted); line-height: 1.45; padding: 0 4px; }

  .topics { display: flex; flex-direction: column; gap: 2px; }
  .trow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: none;
    border-radius: 12px; background: none; color: inherit; text-align: left; transition: background .15s; }
  .trow:hover { background: rgba(255,255,255,.08); }
  .trow.on { background: rgba(255,255,255,.13); }
  .cb { width: 20px; height: 20px; border-radius: 6px; border: 2px solid rgba(255,255,255,.6); flex: none;
    display: grid; place-items: center; color: var(--ink); }
  .cb .ico { width: 14px; height: 14px; stroke-width: 3; }
  .trow.on .cb, .trow.part .cb { background: var(--lemon); border-color: var(--lemon); }
  .trow .nm { flex: 1; min-width: 0; line-height: 1.25; }
  .trow .nm small { display: block; font-size: 12.5px; color: var(--rail-muted); }
  .trow .n { font-size: 13px; color: var(--rail-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .trow .lk { color: var(--pistachio); margin-right: 8px; display: inline-flex; align-items: center; gap: 2px; }
  .trow .lk .ico { width: 13px; height: 13px; stroke-width: 3; }
  .trow.all { font-weight: 600; }
  /* a topic with its own colour (Verbe): name and checkbox in that colour */
  .trow.own .nm { color: var(--tc); font-weight: 600; }
  .trow.own .cb { border-color: var(--tc); }
  .trow.own.on .cb { background: var(--tc); border-color: var(--tc); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .session .mode { font: 700 22px/1.15 var(--word); }
  .session .count { font: 800 54px/1 var(--word); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .session .count small { font-size: 22px; font-weight: 600; color: var(--rail-muted); }
  .rprog { height: 8px; border-radius: 99px; background: var(--rail-deep); overflow: hidden; margin-top: 12px; }
  .rprog i { display: block; height: 100%; background: var(--lemon); border-radius: 99px; transition: width .5s var(--ease); }
  .tally { display: grid; gap: 8px; }
  .tally div { display: flex; align-items: baseline; gap: 10px; background: var(--rail-deep); border-radius: 12px; padding: 9px 14px; }
  .tally b { font: 800 26px/1.1 var(--word); font-variant-numeric: tabular-nums; min-width: 1.4em; }
  .tally span { font-size: 13px; color: var(--rail-muted); }
  .tally .okn b { color: var(--pistachio); } .tally .badn b { color: var(--apricot); }
  .keys { font-size: 13px; color: var(--rail-muted); display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .keys kbd { justify-self: start; }

  .page { padding: 40px clamp(24px, 4.5vw, 72px) 56px; min-width: 0; max-width: 1240px; width: 100%; }

  /* ---------- home ---------- */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .phead h1 { margin: 0; font: 700 30px/1.15 var(--word); letter-spacing: -.01em; }
  .phead p { margin: 4px 0 0; color: var(--muted); }
  .last { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 14px; max-width: 360px; }
  .last b { color: var(--ink); }

  .plate { margin-top: 28px; display: grid; grid-template-columns: 196px minmax(0, 1fr) auto; gap: 44px; align-items: center;
    border-top: 4px solid var(--ink); border-bottom: 1px solid var(--line); padding: 36px 0; }
  .tile { width: 196px; height: 196px; border-radius: var(--r-lg); display: grid; place-items: center;
    font: 800 132px/1 var(--word); color: var(--rail); letter-spacing: -.04em; background: var(--lavender); }
  .tile.apricot { background: var(--apricot); } .tile.pistachio { background: var(--pistachio); }
  .tile.lemon { background: var(--lemon); } .tile.lime { background: var(--lime); }
  .tile .emo { font: 108px/1 var(--emoji); letter-spacing: 0; }
  .tile .ico { width: 92px; height: 92px; stroke-width: 1.8; }
  button.tile { border: none; transition: transform .25s var(--ease), box-shadow .25s; }
  button.tile:hover { transform: translateY(-3px); box-shadow: var(--lift); }
  .word { font: 800 calc(var(--fs, 100) * 1px)/1.02 var(--word); letter-spacing: -.03em;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .word.ru { font-weight: 700; letter-spacing: -.02em; }
  .meta { margin-top: 14px; color: var(--muted); font-size: 18px; }
  .meaning { margin-top: 6px; font: 500 30px/1.25 var(--word); }
  .bigemo { font: 150px/1 var(--emoji); padding-right: 8px; }

  .spk { border: none; background: var(--teal-soft); color: var(--teal); width: 44px; height: 44px; border-radius: 50%;
    display: inline-grid; place-items: center; flex: none; transition: background .15s, transform .15s; }
  .spk:hover { background: var(--mint); transform: scale(1.06); }
  .spk .ico { width: 22px; height: 22px; }
  .spk.sm { width: 34px; height: 34px; } .spk.sm .ico { width: 18px; height: 18px; }
  .spk.tile { width: 176px; height: 176px; border-radius: var(--r-lg); background: var(--lemon); color: var(--rail); }
  .spk.tile:hover { transform: translateY(-3px); box-shadow: var(--lift); background: var(--lemon); }
  .spk.tile .ico { width: 84px; height: 84px; stroke-width: 1.8; }
  .opt .cap { font-size: 18px; line-height: 1.25; }

  .start { margin-top: 30px; display: flex; align-items: center; gap: 18px; width: 100%; max-width: 640px;
    padding: 20px 26px; border: none; border-radius: 20px; background: var(--rail); color: #fff; text-align: left;
    transition: transform .25s var(--ease), box-shadow .25s, background .2s; }
  .start:hover { background: var(--rail-deep); transform: translateY(-2px); box-shadow: var(--lift); }
  .start:disabled { opacity: .45; pointer-events: none; }
  .start .ico { width: 34px; height: 34px; }
  .start b { display: block; font: 700 25px/1.15 var(--word); }
  .start span { font-size: 15px; color: rgba(255,255,255,.82); }
  .start .go { margin-left: auto; }
  .hintline { margin-top: 10px; font-size: 13px; color: var(--muted); }

  .modes { margin-top: 36px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 22px; }
  .mgroup h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .chip { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 14px; border: none;
    border-radius: 12px; background: var(--c, var(--lavender)); transition: transform .2s var(--ease), box-shadow .2s; }
  .chip:hover { transform: translateY(-2px); box-shadow: var(--lift); }
  .chip:disabled { opacity: .45; pointer-events: none; }
  .chip b { display: block; font-weight: 600; }
  .chip span { display: block; font-size: 13px; color: #3d4f53; line-height: 1.35; }

  .settings { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 6px; }
  .settings summary { cursor: pointer; padding: 12px 0; font-weight: 600; display: flex; align-items: center; gap: 10px;
    list-style: none; width: max-content; }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary .ico { transition: transform .2s; }
  .settings[open] summary .chev { transform: rotate(90deg); }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px 22px; padding: 8px 0 4px; }
  .set { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  .set.row { flex-direction: row; align-items: center; gap: 10px; color: var(--ink); }
  .set.row input { width: 18px; height: 18px; accent-color: var(--rail); }
  select { padding: 9px 12px; border-radius: var(--r-sm); border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink); }
  .vinfo { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px;
    border: 1.5px solid var(--line-strong); background: var(--paper); font-weight: 600; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--rail); }
  .btn.primary { background: var(--rail); border-color: var(--rail); color: #fff; }
  .btn.primary:hover { background: var(--rail-deep); }
  .btn.small { padding: 7px 14px; font-size: 14px; }

  /* ---------- stamp (signature) ---------- */
  .stamp { display: inline-grid; place-items: center; flex: none; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid currentColor; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px currentColor;
    font: 800 22px/1 var(--word); letter-spacing: -.02em; transform: rotate(-12deg); color: var(--teal); }
  .stamp.bad { color: var(--brick); }
  .stamp .ico { width: 28px; height: 28px; stroke-width: 3.2; }
  .stamp.sm { width: 40px; height: 40px; font-size: 14px; border-width: 2px; box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 3.5px currentColor; }
  .stamp.sm .ico { width: 18px; height: 18px; }
  .stamp.xl { width: 210px; height: 210px; font-size: 84px; border-width: 6px; box-shadow: inset 0 0 0 7px var(--page), inset 0 0 0 11px currentColor; }
  .stamp.land { animation: stamp .42s var(--ease) both; }
  @keyframes stamp { from { transform: rotate(-26deg) scale(1.7); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-12deg) scale(1); } }

  /* ---------- quiz ---------- */
  .qhead { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 36px; }
  .prompt { font-size: 15px; font-weight: 600; color: var(--muted); }
  .qplate { margin-top: 14px; display: grid; grid-template-columns: 176px minmax(0, 1fr) auto; gap: 40px; align-items: center;
    min-height: 248px; border-top: 4px solid var(--ink); border-bottom: 1px solid var(--line); padding: 32px 0; }
  .qplate .tile { width: 176px; height: 176px; font-size: 116px; }
  .qplate .tile .emo { font-size: 100px; }
  .qemo { font: 150px/1 var(--emoji); padding-right: 8px; }
  .qemo .pic img { width: 150px; height: 150px; }
  .qemo.in { animation: rise .5s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.9); } }
  .qplate .sub { margin-top: 10px; color: var(--muted); font-size: 17px; }
  .opts { margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .opts.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opt { position: relative; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 14px 70px 14px 16px;
    border: 2px solid var(--line); border-radius: var(--r); background: var(--paper); text-align: left;
    font: 500 21px/1.25 var(--ui); transition: transform .2s var(--ease), box-shadow .2s, border-color .15s, opacity .2s, background .2s; }
  .opt.ro { font-family: var(--word); font-weight: 600; }
  .opt .k { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--page); border: 1.5px solid var(--line);
    display: grid; place-items: center; font: 600 14px var(--ui); color: var(--muted); }
  .opt:hover:not(:disabled) { border-color: var(--rail); transform: translateY(-2px); box-shadow: var(--lift); }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--teal); background: var(--teal-soft); }
  .opt.wrong { border-color: var(--brick); background: var(--brick-soft); }
  .opt.dim { opacity: .42; }
  .opt .stamp { position: absolute; right: 14px; top: 50%; margin-top: -20px; }
  .opts.pics .opt { flex-direction: column; justify-content: center; text-align: center; gap: 8px; min-height: 168px; padding: 18px 12px; }
  .opts.pics .opt .k { position: absolute; left: 12px; top: 12px; }
  .opts.pics .opt .stamp { top: 12px; right: 12px; margin-top: 0; }

  .pic { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .pic .emo { font: 56px/1.05 var(--emoji); white-space: nowrap; }
  .pic img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
  .pic.sm img { width: 44px; height: 44px; } .pic.xs img { width: 30px; height: 30px; }
  .pic.card img { width: 72px; height: 72px; } .tile .pic img { width: 100px; height: 100px; }
  .pic .tag { font: 600 12.5px var(--ui); padding: 2px 9px; border-radius: 99px; background: var(--page); color: var(--teal); border: 1px solid var(--line); }
  .pic .tag.warm { background: #fff1e6; color: #9a4410; border-color: #f6d2b5; }
  .pic .tag.cold { background: #e7f2fb; color: #1e5a8a; border-color: #c8def0; }
  .pic.mob { display: none; }
  .pic.sm .emo { font-size: 40px; } .pic.sm .tag { font-size: 11px; }
  .pic.xs .emo { font-size: 30px; } .pic.xs .tag { display: none; }
  .pic.card .emo { font-size: 60px; }

  .after { margin-top: 18px; min-height: 132px; }
  .reveal { display: flex; align-items: center; gap: 20px; padding: 16px 20px; border-radius: var(--r);
    background: var(--paper); border: 1px solid var(--line); }
  .reveal .info { flex: 1; min-width: 0; }
  .reveal .verdict { font: 700 18px var(--word); color: var(--teal); }
  .reveal.bad .verdict { color: var(--brick); }
  .reveal .line { margin-top: 2px; font-size: 17px; }
  .reveal .line b { font-family: var(--word); font-weight: 700; font-size: 19px; }
  .tr { color: var(--muted); font-size: 14px; font-weight: 400; }
  .ex { display: inline-flex; align-items: flex-start; gap: 6px; margin-top: 4px; font-size: 14px; color: var(--muted);
    cursor: pointer; border: none; background: none; padding: 0; text-align: left; }
  .ex .ico { width: 14px; height: 14px; margin-top: 3px; color: var(--teal); }
  .ex:hover { color: var(--teal); }
  .nextrow { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .nextrow .btn { margin-left: auto; }
  .lrn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
  .lrn input { width: 18px; height: 18px; margin: 0; accent-color: var(--teal); cursor: pointer; }

  /* ---------- pairs ---------- */
  .match { margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lrow { display: flex; align-items: center; gap: 10px; }
  .lrow .mi { flex: 1; }
  .mi { position: relative; min-height: 66px; padding: 10px 16px; border: 2px solid var(--line); border-radius: var(--r); background: var(--paper);
    font-size: 19px; transition: transform .2s var(--ease), box-shadow .2s, border-color .15s, background .2s, opacity .3s; }
  .mi.ro { font: 600 21px var(--word); }
  .mi:hover { border-color: var(--rail); transform: translateY(-2px); box-shadow: var(--lift); }
  .mi.sel { border-color: var(--rail); background: var(--teal-soft); transform: translateY(-2px); box-shadow: var(--lift); }
  .mi.done { border-color: var(--teal-soft); background: var(--teal-soft); color: var(--muted); pointer-events: none; transform: none; box-shadow: none; }
  .mi .stamp { position: absolute; right: 10px; top: 50%; margin-top: -20px; }
  .mi.done:has(.stamp) { padding-right: 58px; }
  .mi.wrong { border-color: var(--brick); background: var(--brick-soft); animation: shake .35s; }
  .mi .pr { display: flex; align-items: center; justify-content: center; gap: 12px; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .lhint { font-size: 13px; color: var(--muted); }
  .match + .nextrow { margin-top: 18px; }
  .mi.gone { opacity: .4; }

  /* ---------- cards ---------- */
  .cards { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
    display: flex; flex-direction: column; transition: opacity .2s; }
  .card .top { background: var(--c, var(--lavender)); min-height: 104px; display: grid; place-items: center; padding: 14px; }
  .card .top .nopic { font: 800 56px/1 var(--word); color: var(--rail); }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card .cro { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 700 22px/1.2 var(--word); }
  .card .cru { font-size: 16px; }
  .card .note { font-size: 13px; color: var(--muted); }
  .card .st { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .card.learned { opacity: .55; }
  .hidden-txt { filter: blur(7px); cursor: pointer; user-select: none; }

  /* ---------- tables ---------- */
  .vtable { margin-top: 24px; }
  .vtable + .vtable { margin-top: 48px; }
  .vtable h2 { margin: 0 0 14px; font: 700 28px var(--word); }
  .vscroll { overflow-x: auto; }
  .vtable table { border-collapse: separate; border-spacing: 0; background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--r-lg); overflow: hidden; }
  .vtable th, .vtable td { padding: 0; text-align: left; border-bottom: 1px solid var(--line); }
  .vtable tbody tr:last-child > * { border-bottom: none; }
  .vtable thead > tr > * { background: var(--c, var(--lavender)); padding: 14px 20px 12px; vertical-align: bottom; }
  .vtable thead th { font: 700 20px/1.2 var(--word); white-space: nowrap; }
  .vtable thead th small { display: block; margin-top: 2px; font: 400 13px var(--ui); color: #3d4f53; }
  .vtable tbody th { padding: 0 20px; font: 500 18px var(--word); color: var(--muted); white-space: nowrap; }
  .vform { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 20px;
    border: none; background: none; text-align: left; font: 700 24px/1.2 var(--word); white-space: nowrap; transition: background .15s; }
  .vform .ico { width: 16px; height: 16px; color: var(--teal); opacity: .35; transition: opacity .15s; }
  .vform:hover { background: var(--teal-soft); }
  .vform:hover .ico, .vform:focus-visible .ico { opacity: 1; }
  .vnotes { margin: 18px 0 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; font-size: 15px; color: var(--muted); }

  /* ---------- results ---------- */
  .result { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 48px; align-items: center;
    border-bottom: 1px solid var(--line); padding: 8px 0 40px; }
  .result h1 { margin: 0; font: 800 64px/1 var(--word); letter-spacing: -.03em; }
  .result .gname { margin-top: 10px; font: 500 24px var(--word); color: var(--muted); }
  .result .score { margin-top: 14px; font-size: 18px; }
  .mlist { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .mrow { display: flex; align-items: center; gap: 14px; background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--r); padding: 10px 14px; }
  .mrow .w { flex: 1; min-width: 0; } .mrow b { font: 700 19px var(--word); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  h2.sec { margin: 34px 0 0; font: 700 20px var(--word); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: 12px; font-size: 14px; max-width: min(90vw, 560px); opacity: 0;
    transition: opacity .25s, transform .35s var(--ease); pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1080px) {
    .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .plate { grid-template-columns: 150px minmax(0, 1fr); }
    .plate .tile { width: 150px; height: 150px; font-size: 100px; }
    .bigemo { display: none; }
  }
  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { position: static; height: auto; padding: 18px 16px; gap: 14px; }
    .rail-foot { margin-top: 0; }
    .brand b { font-size: 22px; } .brand b br { display: none; } .brand small { margin-top: 4px; }
    .topics { flex-direction: row; flex-wrap: wrap; gap: 6px; }
    .trow { width: auto; padding: 7px 11px; gap: 8px; border: 1px solid var(--rail-line); }
    .trow .nm small { display: none; }
    .rail .label { display: none; }
    .rail.sess { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px 14px; }
    .rail.sess > * { grid-column: 1 / -1; }
    .rail.sess > .session { grid-column: 1; } .rail.sess > .tally { grid-column: 2; }
    .rail.sess .brand, .rail.sess .keys, .rail.sess .rnote, .rail.sess .session .label { display: none; }
    .rail.sess .session .mode { font-size: 17px; }
    .rail.sess .session .count { font-size: 30px; margin-top: 4px !important; }
    .rail.sess .tally { display: flex; flex-direction: column; gap: 6px; }
    .rail.sess .tally div { padding: 5px 10px; }
    .rail.sess .tally b { font-size: 17px; display: inline; margin-right: 4px; }
    .rail.sess .rbtn { padding: 8px 12px; }
    .page { padding: 22px 16px 40px; }
    .page.home { display: flex; flex-direction: column; }
    .page.home .start { order: 1; margin-top: 18px; } .page.home .plate { order: 2; }
    .page.home .modes { order: 3; } .page.home .settings { order: 4; } .hintline { display: none; }
    .word { --k: .62; font-size: calc(var(--fs, 100) * var(--k) * 1px); }
    .plate, .qplate { grid-template-columns: 96px minmax(0, 1fr); gap: 18px; padding: 22px 0; min-height: 0; }
    .plate .tile, .qplate .tile, .spk.tile { width: 96px; height: 96px; font-size: 62px; border-radius: 18px; }
    .spk.tile .ico { width: 48px; height: 48px; }
    .qplate .tile .emo, .plate .tile .emo { font-size: 56px; } .tile .ico { width: 52px; height: 52px; }
    .meaning { font-size: 22px; } .meta { font-size: 15px; }
    .opts, .opts.six { grid-template-columns: 1fr; gap: 8px; margin-top: 16px; }
    .opt { min-height: 54px; font-size: 18px; padding: 10px 56px 10px 12px; }
    .qhead { min-height: 0; }
    .qemo { display: none; } .pic.mob { display: flex; }
    .after { min-height: 0; }
    .opts.pics { grid-template-columns: 1fr 1fr; }
    .modes { grid-template-columns: 1fr; }
    .result { grid-template-columns: 1fr; gap: 20px; }
    .stamp.xl { width: 140px; height: 140px; font-size: 56px; }
    .mi, .mi.ro { font-size: 16px; }
    .reveal { flex-wrap: wrap; gap: 10px 14px; padding: 14px; }
    .reveal .info { order: 3; flex: 1 1 100%; }
    .reveal > .stamp:not(.sm) { width: 48px; height: 48px; }
    .reveal > .stamp .ico { width: 22px; height: 22px; }
    .reveal .spk { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="page" id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="words.js"></script>
<script src="audio/index.js"></script>
<script>
'use strict';

/* ================= helpers ================= */
const app = document.getElementById('app');
const rail = document.getElementById('rail');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickRandom = a => a[Math.random() * a.length | 0];
const LS = {
  get(k, d) { try { const v = localStorage.getItem('learnro.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('learnro.' + k, JSON.stringify(v)); } catch (e) {} },
};
let toastTimer;
function toast(msg, ms = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* Line icons (one stroke family) */
const ICONS = {
  speaker: '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  minus: '<path d="M6 12h12"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  shuffle: '<path d="M3 7h3.5c2.5 0 3.5 1.5 5 5s2.5 5 5 5H21"/><path d="M3 17h3.5c1.2 0 2-.4 2.7-1.2M14.8 8.2c.7-.8 1.5-1.2 2.7-1.2H21"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
};
const icon = (name, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

/* ================= data ================= */
const TOPICS = (window.TOPICS || []).map(t => ({
  ...t, words: t.words.map(w => ({ ...w, topic: t.id, key: w.ro })),
}));
const ALL = TOPICS.flatMap(t => t.words);
const CRAYONS = ['var(--lavender)', 'var(--apricot)', 'var(--pistachio)', 'var(--lemon)', 'var(--mint)', 'var(--lime)'];
// A topic with its own colour (t.color) keeps it; the rest take turns through the crayons.
const topicColor = id => {
  const t = TOPICS.find(t => t.id === id);
  if (t && t.color) return `var(--${t.color})`;
  return CRAYONS[Math.max(0, TOPICS.filter(t => !t.color).indexOf(t)) % CRAYONS.length];
};

const settings = Object.assign(
  { options: 4, length: 'all', autoplay: true, autonext: true, voice: 'auto', rate: 0.85 },
  LS.get('settings', {})
);
// "baza" was split into saluturi, politete and oras
let selected = LS.get('topics', []).flatMap(id => id === 'baza' ? ['saluturi', 'politete', 'oras'] : [id])
  .filter((id, i, a) => TOPICS.some(t => t.id === id) && a.indexOf(id) === i);
// first visit: start with the first vocabulary topic, not the grammar tables
if (!selected.length && TOPICS.length) selected = [(TOPICS.find(t => !t.tables) || TOPICS[0]).id];
const BY_KEY = new Map(ALL.map(w => [w.key, w]));
// A word's key is the Romanian word itself, so stats survive moving it to another topic.
// Older versions stored "topic|word"; merge those into the plain key once.
const plainKey = k => k.includes('|') ? k.slice(k.indexOf('|') + 1) : k;
const stats = (() => {
  const raw = LS.get('stats', {}), out = {};
  for (const [k, v] of Object.entries(raw)) {
    const s = out[plainKey(k)] || (out[plainKey(k)] = { c: 0, w: 0 });
    s.c += v.c || 0; s.w += v.w || 0;
  }
  if (Object.keys(raw).some(k => k.includes('|'))) LS.set('stats', out);
  return out;
})();
// Words marked as learned are left out of all exercises (cards still show them).
const learned = (() => {
  const raw = LS.get('learned', []);
  const set = new Set(raw.map(plainKey).filter(k => BY_KEY.has(k)));
  if (raw.some(k => k.includes('|'))) LS.set('learned', [...set]);
  return set;
})();
const isLearned = w => learned.has(w.key);

const saveSettings = () => LS.set('settings', settings);
const selectedWords = () => TOPICS.filter(t => selected.includes(t.id)).flatMap(t => t.words);
const selectedTables = () => TOPICS.filter(t => selected.includes(t.id)).flatMap(t => (t.tables || []).map(tb => ({ ...tb, topic: t.id })));
const practiceWords = () => selectedWords().filter(w => !isLearned(w));
function record(w, ok) {
  const s = stats[w.key] || (stats[w.key] = { c: 0, w: 0 });
  ok ? s.c++ : s.w++;
  LS.set('stats', stats);
}

// Romanian school marks (calificative) for a session result
function grade(pct) {
  if (pct >= 90) return { g: 'FB', name: 'Foarte bine', ru: 'отлично', ok: true };
  if (pct >= 70) return { g: 'B', name: 'Bine', ru: 'хорошо', ok: true };
  if (pct >= 50) return { g: 'S', name: 'Suficient', ru: 'удовлетворительно', ok: false };
  return { g: 'I', name: 'Insuficient', ru: 'нужно повторить', ok: false };
}
const stamp = (ok, inner, cls = '') => `<span class="stamp ${ok ? '' : 'bad'} ${cls}" aria-hidden="true">${inner}</span>`;

// Word size steps so long phrases still fit the plate
const wordSize = (text, steps) => (steps.find(([n]) => [...text].length <= n) || steps[steps.length - 1])[1];
const FS_PLATE = [[7, 112], [11, 92], [15, 74], [21, 60], [99, 46]];
const FS_RU = [[8, 80], [14, 64], [22, 50], [99, 40]];
const initial = s => { const c = (s.match(/\p{L}/u) || ['?'])[0]; return c.toUpperCase() + c.toLowerCase(); };

/* ================= speech ================= */
const Speech = {
  voices: [],
  audio: null,
  load() {
    if (!('speechSynthesis' in window)) return;
    this.voices = speechSynthesis.getVoices().filter(v => /^ro([-_]|$)/i.test(v.lang));
    // female first, then natural/online voices first
    const rank = v => (this.isFemale(v) ? 2 : 0) + (/natural|online/i.test(v.name) ? 1 : 0);
    this.voices.sort((a, b) => rank(b) - rank(a));
    if (screen === 'home') renderVoiceUI();
  },
  isFemale: v => /alina|ioana|elena|carmen|maria|female|woman/i.test(v.name),
  isMale: v => /andrei|emil|male/i.test(v.name) && !/female/i.test(v.name),
  engine() {
    if (settings.voice === 'google') return 'google';
    if (settings.voice !== 'auto') {
      const v = this.voices.find(v => v.name === settings.voice);
      if (v) return v;
    }
    // Auto: a female system voice if there is one, otherwise Google (also a female voice)
    return this.voices.find(v => this.isFemale(v)) || 'google';
  },
  say(item) {
    if (!item) return;
    if (item.audio) { this.playUrl(item.audio, item.ro); return; }
    const text = item.ro;
    const e = this.engine();
    if (e === 'google') { this.google(text); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = e; u.lang = e.lang; u.rate = settings.rate;
    speechSynthesis.speak(u);
  },
  google(text) {
    // saved recording (tools/make-audio.mjs) if there is one, otherwise ask Google online
    const saved = (window.AUDIO || {})[text];
    if (saved) { this.playUrl(saved, text, settings.rate); return; }
    const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ro&q=' + encodeURIComponent(text);
    this.playUrl(url, text, settings.rate);
  },
  playUrl(url, text, rate = 1) {
    if (this.audio) this.audio.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const a = this.audio = new Audio(url);
    a.playbackRate = Math.max(rate, 0.7);
    a.play().catch(() => {
      // last resort: browser default voice with Romanian language tag
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text); u.lang = 'ro-RO'; u.rate = settings.rate;
        speechSynthesis.speak(u);
      }
      toast(/^https?:/.test(url)
        ? 'Для этого текста нет сохранённой записи, а загрузить звук из интернета не удалось.'
        : 'Не удалось воспроизвести запись ' + url);
    });
  },
};
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => Speech.load();
}

/* Speaker buttons: render with sayBtn(), activate with bindSay() after innerHTML. */
let sayRegistry = [];
function sayBtn(item, cls = '') {
  sayRegistry.push(item);
  return `<button class="spk ${cls}" data-say="${sayRegistry.length - 1}" title="Послушать" aria-label="Послушать">${icon('speaker')}</button>`;
}
function bindSay(root = app) {
  root.querySelectorAll('[data-say]').forEach(b => {
    if (b.dataset.sbound) return;
    b.dataset.sbound = '1';
    b.addEventListener('click', e => { e.stopPropagation(); Speech.say(sayRegistry[+b.dataset.say]); });
  });
}
let activeBoard = null;   // the pairs board on screen, so "learned" can take a pair out of it
function setHTML(html) { activeBoard = null; if (screen !== 'home') app.classList.remove('home'); app.innerHTML = html; bindSay(); bindLearn(); fitWords(); window.scrollTo(0, 0); }
// Shrink big words until the longest one fits its column (no mid-word breaks)
function fitWords() {
  app.querySelectorAll('.word').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize);
    const text = el.firstChild;
    if (!text || text.nodeType !== 3) return;
    const range = document.createRange();
    range.selectNodeContents(text);
    const widest = () => Math.max(...[...range.getClientRects()].map(r => r.width), 0);
    while (size > 26 && widest() > el.clientWidth - 1) { size -= 3; el.style.fontSize = size + 'px'; }
  });
}
addEventListener('resize', () => { clearTimeout(fitWords.t); fitWords.t = setTimeout(fitWords, 120); });
function setRail(html, sess = false) {
  rail.innerHTML = html;
  rail.classList.toggle('sess', sess);
  rail.querySelectorAll('[data-act=menu]').forEach(b => b.onclick = renderHome);
}
const brand = (home = false) => home
  ? `<div class="brand"><b>Învățăm <br>cuvinte</b><small>румынский по урокам</small></div>`
  : `<button class="brand" data-act="menu" title="В меню"><b>Învățăm <br>cuvinte</b><small>румынский по урокам</small></button>`;

/* "Learned" checkboxes: render with learnBox(), activate with bindLearn() after innerHTML. */
function learnBox(w, withLabel = true) {
  return `<label class="lrn" title="Выучено — больше не показывать в упражнениях"><input type="checkbox"
    data-learn="${esc(w.key)}" ${isLearned(w) ? 'checked' : ''} aria-label="Выучено: ${esc(w.ro)}">${withLabel ? '<span>выучено</span>' : ''}</label>`;
}
function bindLearn() {
  app.querySelectorAll('[data-learn]').forEach(cb => {
    if (cb.dataset.bound) return;
    cb.dataset.bound = '1';
    cb.closest('label').addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', () => setLearned(BY_KEY.get(cb.dataset.learn), cb.checked));
  });
}
function setLearned(w, on) {
  on ? learned.add(w.key) : learned.delete(w.key);
  LS.set('learned', [...learned]);
  app.querySelectorAll('[data-learn]').forEach(cb => { if (cb.dataset.learn === w.key) cb.checked = on; });
  app.querySelectorAll(`.card[data-key="${CSS.escape(w.key)}"]`).forEach(c => c.classList.toggle('learned', on));
  // drop the word's remaining single questions from the current session
  if (on && screen === 'quiz' && Q) Q.queue = Q.queue.filter((it, i) => i <= Q.i || it.w !== w);
  if (on && activeBoard) activeBoard.learned(w);
  if (on) toast(`«${w.ro}» — выучено, в упражнениях больше не будет`, 2000);
}

/* ================= pictures ================= */
const hasPic = w => !!(w.pic || w.img);
function picHTML(w, size = '') {
  if (!hasPic(w)) return '';
  let tag = '';
  if (w.tag) {
    const t = String(w.tag).trim();
    const cls = /^[−-]/.test(t) || /^\+?[0-5]°/.test(t) ? 'cold' : /^\+/.test(t) ? 'warm' : '';
    tag = `<span class="tag ${cls}">${esc(t)}</span>`;
  }
  const body = w.img ? `<img src="${esc(w.img)}" alt="">` : `<span class="emo">${esc(w.pic)}</span>`;
  return `<div class="pic ${size}">${body}${tag}</div>`;
}

/* ================= modes ================= */
const QUIZ_TYPES = ['ro-ru', 'ru-ro', 'audio-ru', 'ro-pic', 'pic-ro'];
// question type for "mix": words without a picture skip the picture types
const mixType = w => pickRandom(hasPic(w) ? QUIZ_TYPES : QUIZ_TYPES.filter(t => t !== 'ro-pic' && t !== 'pic-ro'));
// same synonym group (syn) — never offered together as options or in one pairs round
const sameSyn = (a, b) => !!(a.syn && a.syn === b.syn);
const MODE_GROUPS = [
  { name: 'Изучение', color: 'var(--lavender)', modes: [
    { id: 'cards', name: 'Карточки', desc: 'Посмотреть, послушать, проверить себя' },
    { id: 'tables', name: 'Таблицы', desc: 'Формы глаголов в одной таблице' }] },
  { name: 'Перевод', color: 'var(--apricot)', modes: [
    { id: 'ro-ru', name: 'RO → RU', desc: 'Выбрать перевод слова' },
    { id: 'ru-ro', name: 'RU → RO', desc: 'Выбрать румынское слово' },
    { id: 'audio-ru', name: 'На слух', desc: 'Услышать и выбрать перевод' }] },
  { name: 'С картинками', color: 'var(--pistachio)', modes: [
    { id: 'ro-pic', name: 'RO → картинка', desc: 'Перевод с картинкой-подсказкой' },
    { id: 'pic-ro', name: 'Картинка → RO', desc: 'Картинка с переводом → слово' }] },
  { name: 'Пары', color: 'var(--lemon)', modes: [
    { id: 'match-ru', name: 'Слово — перевод', desc: 'Соединить пары из двух списков' },
    { id: 'match-pic', name: 'Слово — картинка', desc: 'Слово и картинка с переводом' }] },
];
const MODE_NAMES = Object.fromEntries(MODE_GROUPS.flatMap(g => g.modes.map(m => [m.id, m.name])));
MODE_NAMES.mix = 'Микс';
const PROMPTS = {
  'ro-ru': 'Выберите перевод',
  'ru-ro': 'Выберите румынское слово',
  'audio-ru': 'Послушайте и выберите перевод',
  'ro-pic': 'Выберите перевод',
  'pic-ro': 'Выберите румынское слово',
};

let screen = 'home';
let last = null;   // { mode, words } — for "again" / "retry mistakes"
let featuredKey = null;

/* ================= home ================= */
function renderHome() {
  screen = 'home';
  app.classList.add('home');
  sayRegistry = [];
  if (Q) clearTimeout(Q.timer);
  const sel = practiceWords();
  const learnedSel = selectedWords().filter(isLearned);
  const allOn = selected.length === TOPICS.length;
  const opt = (v, cur, label) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${label}</option>`;

  setRail(`
    ${brand(true)}
    <nav aria-label="Темы">
      <div class="label">Темы</div>
      <div class="topics">
        ${TOPICS.length > 1 ? `<button class="trow all ${allOn ? 'on' : selected.length ? 'part' : ''}" data-all aria-pressed="${allOn}">
          <span class="cb">${allOn ? icon('check') : selected.length ? icon('minus') : ''}</span>
          <span class="nm">Все темы</span><span class="n">${ALL.length}</span></button>` : ''}
        ${TOPICS.map(t => { const on = selected.includes(t.id); const k = t.words.filter(isLearned).length; return `
          <button class="trow ${on ? 'on' : ''} ${t.color ? 'own' : ''}" data-topic="${esc(t.id)}" aria-pressed="${on}"
            ${t.color ? `style="--tc:var(--${esc(t.color)})"` : ''}>
            <span class="cb">${on ? icon('check') : ''}</span>
            <span class="nm">${esc(t.name)}<small>${esc(t.ru || '')}</small></span>
            <span class="n">${k ? `<span class="lk" title="выучено">${icon('check')}${k}</span>` : ''}${t.words.length}</span>
          </button>`; }).join('')}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
}

// The word shown on the home plate: stays put until it leaves the practice set
function featuredWord(sel) {
  if (!sel.length) return null;
  let w = BY_KEY.get(featuredKey);
  if (!w || !sel.includes(w)) { w = sessionWords(sel)[0]; featuredKey = w.key; }
  return w;
}

function renderVoiceUI() {
  const sel = document.getElementById('voiceSel');
  const info = document.getElementById('voiceInfo');
  if (!sel) return;
  const o = (v, label) => `<option value="${esc(v)}" ${settings.voice === v ? 'selected' : ''}>${esc(label)}</option>`;
  const gender = v => Speech.isFemale(v) ? '♀ ' : Speech.isMale(v) ? '♂ ' : '';
  sel.innerHTML = o('auto', 'Авто (женский)') + Speech.voices.map(v => o(v.name, gender(v) + v.name)).join('')
    + o('google', '♀ Google (сохранённые записи)');
  const e = Speech.engine();
  info.textContent = e === 'google'
    ? 'Голос: Google, женский — записи всех слов сохранены в папке audio, интернет не нужен. Самый естественный женский голос — «Alina (Natural)» в браузере Microsoft Edge.'
    : 'Голос: ' + gender(e) + e.name;
}

function sessionWords(words = practiceWords()) {
  // Words with more mistakes come earlier (weighted random order).
  const keyed = words.map(w => {
    const s = stats[w.key] || { c: 0, w: 0 };
    const weight = 1 + 3 * s.w / (1 + s.c);
    return { w, k: Math.pow(Math.random(), 1 / weight) };
  }).sort((a, b) => b.k - a.k).map(x => x.w);
  const n = settings.length === 'all' ? keyed.length : Math.min(+settings.length, keyed.length);
  return shuffle(keyed.slice(0, n));
}

function startMode(mode, words) {
  if (mode === 'tables') return renderTables();
  if (mode !== 'cards') words = words.filter(w => !isLearned(w));
  if (!words.length) { toast('Все эти слова отмечены как выученные'); return; }
  last = { mode, words };
  if (mode === 'cards') return renderCards(words);
  if (mode === 'match-ru' || mode === 'match-pic') return startMatch(mode, words);
  startQuiz(mode, words);
}

/* ================= session rail ================= */
function sessionRail(mode, done, total, ok, bad, keys) {
  setRail(`
    ${brand()}
    <div class="session">
      <div class="mode">${esc(MODE_NAMES[mode] || '')}</div>
      <div class="count" style="margin-top:14px"><span id="sDone">${done}</span> <small>/ <span id="sTotal">${total}</span></small></div>
      <div class="rprog"><i id="sProg" style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
    </div>
    <div class="tally">
      <div class="okn"><b id="sOk">${ok}</b><span id="sOkL">${okLabel(ok)}</span></div>
      <div class="badn"><b id="sBad">${bad}</b><span id="sBadL">${badLabel(bad)}</span></div>
    </div>
    ${keys ? `<div class="keys">${keys}</div>` : ''}
    <div class="rail-foot"><button class="rbtn" data-act="menu">${icon('back')} Завершить <kbd>Esc</kbd></button></div>
  `, true);
}
const okLabel = n => plural(n, 'верный ответ', 'верных ответа', 'верных ответов');
const badLabel = n => plural(n, 'ошибка', 'ошибки', 'ошибок');
const setScore = (ok, bad) => {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('sOk', ok); set('sBad', bad); set('sOkL', okLabel(ok)); set('sBadL', badLabel(bad));
};
const setProgress = (done, total) => {
  const d = document.getElementById('sDone'), t = document.getElementById('sTotal'), p = document.getElementById('sProg');
  if (d) d.textContent = done; if (t) t.textContent = total;
  if (p) p.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
};

/* ================= quiz ================= */
let Q = null;

// Mix: after every 6 questions (and at the end) a pairs round reviews the words just asked.
function buildMixQueue(words) {
  const queue = [];
  let since = [];
  const addPairs = () => {
    const kind = pickRandom(['ru', 'pic']);
    const ws = pickPairs(since, kind, 5);
    if (ws.length >= 3) queue.push({ type: 'match', words: ws, kind });
    since = [];
  };
  words.forEach(w => {
    queue.push({ w, type: mixType(w) });
    since.push(w);
    if (since.length === 6) addPairs();
  });
  if (since.length >= 3) addPairs();
  return queue;
}

// Up to `max` words that can share one pairs board: no equal translations or synonyms,
// and (with pictures) no look-alike pictures.
function pickPairs(words, kind, max) {
  const out = [];
  for (const w of words) {
    if (out.length === max) break;
    if (out.some(x => x.ru === w.ru || sameSyn(x, w) || (kind === 'pic' && w.grp && x.grp === w.grp))) continue;
    out.push(w);
  }
  return out;
}

function startQuiz(mode, words) {
  const pool = selectedWords();
  Q = {
    mode, words, pool,
    queue: mode === 'mix' ? buildMixQueue(words) : words.map(w => ({ w, type: mode })),
    i: 0, ok: 0, bad: 0, firstOk: 0,
    seen: new Set(), mistakes: new Set(), retries: new Map(),
    answered: false, timer: null,
  };
  screen = 'quiz';
  const keys = `<kbd>1–${settings.options}</kbd><span>ответ</span><kbd>Enter</kbd><span>дальше</span><kbd>R</kbd><span>повторить звук</span>`;
  sessionRail(mode, 0, Q.queue.length, 0, 0, keys);
  renderQuestion();
}

function buildOptions(w, type) {
  const n = settings.options;
  const isPic = type === 'ro-pic' || type === 'pic-ro';
  const okCand = c => c !== w && c.ro !== w.ro && c.ru !== w.ru && !sameSyn(c, w) &&
    !(isPic && ((w.grp && c.grp === w.grp) || (hasPic(w) && c.pic === w.pic && !c.img)));
  let cand = shuffle(Q.pool.filter(okCand));
  if (cand.length < n - 1) cand = cand.concat(shuffle(ALL.filter(c => okCand(c) && !cand.includes(c))));
  return shuffle([w, ...cand.slice(0, n - 1)]);
}

function requeue(w, type) {
  const r = Q.retries.get(w.key) || 0;
  if (r >= 2) return;
  Q.retries.set(w.key, r + 1);
  const pos = Math.min(Q.queue.length, Q.i + 3 + (Math.random() * 3 | 0));
  Q.queue.splice(pos, 0, { w, type: Q.mode === 'mix' ? mixType(w) : type });
  setProgress(Q.i, Q.queue.length);
}

// The question plate: same frame for every type, only the tile and the text change
function questionPlate(w, type) {
  if (type === 'ru-ro') return `<div class="tile apricot" aria-hidden="true">?</div>
    <div><div class="word ru" style="--fs:${wordSize(w.ru, FS_RU)}">${esc(w.ru)}</div></div>`;
  if (type === 'pic-ro') return `<div class="tile pistachio" aria-hidden="true">${w.img ? picHTML(w) : `<span class="emo">${esc(w.pic)}</span>`}</div>
    <div><div class="word ru" style="--fs:${wordSize(w.ru, FS_RU)}">${esc(w.ru)}</div>${w.tag ? `<div class="sub">${esc(w.tag)}</div>` : ''}</div>`;
  if (type === 'audio-ru') return `${sayBtn(w, 'tile lemon')}
    <div><div class="word ru" style="--fs:56">Послушайте</div><div class="sub">Нажмите на динамик или <kbd>R</kbd>, чтобы услышать ещё раз</div></div>`;
  return `<div class="tile" style="background:${topicColor(w.topic)}" aria-hidden="true">${esc(initial(w.ro))}</div>
    <div><div class="word" style="--fs:${wordSize(w.ro, FS_PLATE)}">${esc(w.ro)} ${sayBtn(w)}</div></div>`;
}

function renderQuestion() {
  clearTimeout(Q.timer);
  sayRegistry = [];
  setProgress(Q.i, Q.queue.length);
  const item = Q.queue[Q.i];
  if (item.type === 'match') return renderMixPairs(item);
  const { w, type } = item;
  item.opts = item.opts || buildOptions(w, type);
  Q.answered = false;

  const isPicOpts = type === 'ro-pic';
  const roOpts = type === 'ru-ro' || type === 'pic-ro';
  const optLabel = o => isPicOpts ? `${picHTML(o)}<span class="cap">${esc(o.ru)}</span>` : `<span>${esc(roOpts ? o.ro : o.ru)}</span>`;

  setHTML(`
    <div class="qhead"><span class="prompt">${PROMPTS[type]}</span></div>
    <section class="qplate">${questionPlate(w, type)}<div class="qemo" id="qemo" aria-hidden="true"></div></section>
    <div class="opts ${isPicOpts ? 'pics' : ''} ${item.opts.length === 6 && !isPicOpts ? 'six' : ''}">
      ${item.opts.map((o, i) => `<button class="opt ${roOpts ? 'ro' : ''}" data-i="${i}"><span class="k">${i + 1}</span>${optLabel(o)}</button>`).join('')}
    </div>
    <div class="after" id="after"></div>
  `);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.i));

  if (settings.autoplay && (type === 'ro-ru' || type === 'ro-pic' || type === 'audio-ru')) {
    setTimeout(() => Speech.say(w), 150);
  }
}

function answer(idx) {
  if (Q.answered) return;
  const item = Q.queue[Q.i];
  const { w, type } = item;
  const chosen = item.opts[idx];
  if (!chosen) return;
  Q.answered = true;
  const ok = chosen === w;

  app.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (item.opts[i] === w) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', stamp(true, icon('check'), 'sm land')); }
    else if (i === idx) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', stamp(false, icon('x'), 'sm land')); }
    else b.classList.add('dim');
  });

  const first = !Q.seen.has(w.key);
  Q.seen.add(w.key);
  record(w, ok);
  if (ok) { Q.ok++; if (first) Q.firstOk++; }
  else { Q.bad++; Q.mistakes.add(w); requeue(w, type); }   // ask this word again a bit later
  setScore(Q.ok, Q.bad);

  if (settings.autoplay && (type === 'ru-ro' || type === 'pic-ro' || !ok)) Speech.say(w);

  const qemo = document.getElementById('qemo');
  if (qemo && hasPic(w) && type !== 'pic-ro') {
    qemo.innerHTML = w.img ? picHTML(w) : esc(w.pic);
    qemo.classList.add('in');
  }
  const after = document.getElementById('after');
  after.innerHTML = `
    <div class="reveal ${ok ? 'ok' : 'bad'}">
      ${stamp(ok, ok ? 'FB' : icon('x'), 'land')}
      <div class="info">
        <div class="verdict">${ok ? 'Верно!' : 'Неверно'}</div>
        <div class="line"><b>${esc(w.ro)}</b> ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''} — ${esc(w.ru)}</div>
        ${w.note ? `<div class="tr">${esc(w.note)}</div>` : ''}
        ${w.ex ? `<button class="ex" data-ex title="Послушать пример">${icon('speaker')}<span>${esc(w.ex)} — ${esc(w.exRu || '')}</span></button>` : ''}
      </div>
      ${type !== 'pic-ro' ? picHTML(w, 'sm mob') : ''}
      ${sayBtn(w)}
    </div>
    <div class="nextrow">
      ${learnBox(w)}
      <button class="btn primary" data-act="next">Дальше ${icon('arrow')}</button>
    </div>`;
  bindSay(); bindLearn();
  const ex = after.querySelector('[data-ex]');
  if (ex) ex.onclick = () => Speech.say({ ro: w.ex });
  after.querySelector('[data-act=next]').onclick = nextQuestion;
  const r = after.getBoundingClientRect();
  if (r.bottom > innerHeight) after.scrollIntoView({ behavior: 'smooth', block: 'end' });
  if (ok && settings.autonext) Q.timer = setTimeout(nextQuestion, 1300);
}

function renderMixPairs(item) {
  Q.answered = false;
  const board = matchBoard(item.words, item.kind);
  setHTML(`
    <div class="qhead"><span class="prompt">Соедините пары: слово и ${item.kind === 'pic' ? 'картинку с переводом' : 'перевод'}</span></div>
    ${board.html}
  `);
  const missed = new Set();
  board.bind({
    onHit(w) {
      Q.ok++;
      if (!missed.has(w)) record(w, true);
      if (!Q.seen.has(w.key)) { Q.seen.add(w.key); if (!missed.has(w)) Q.firstOk++; }
      setScore(Q.ok, Q.bad);
    },
    onMiss(w) {
      Q.bad++;
      if (!missed.has(w)) { record(w, false); requeue(w); }
      missed.add(w); Q.mistakes.add(w); Q.seen.add(w.key);
      setScore(Q.ok, Q.bad);
    },
    onDone(skipped) { Q.answered = true; Q.timer = setTimeout(nextQuestion, skipped.length ? 0 : 600); },
  });
}

function nextQuestion() {
  if (screen !== 'quiz' || !Q.answered) return;
  clearTimeout(Q.timer);
  Q.i++;
  if (Q.i >= Q.queue.length) {
    renderResults({ good: Q.firstOk, total: Q.words.length, mistakes: [...Q.mistakes], unit: 'с первой попытки', ok: Q.ok, bad: Q.bad });
  } else renderQuestion();
}

/* ================= match ================= */
let M = null;

function startMatch(mode, words) {
  const kind = mode === 'match-pic' ? 'pic' : 'ru';
  const size = window.innerWidth < 520 ? 5 : 6;
  const target = Math.ceil(words.length / Math.ceil(words.length / size));
  // split into rounds; with pictures, keep look-alike words (same grp) in different rounds
  const chunks = [];
  for (const w of words) {
    let c = chunks.find(c => c.length < target &&
      !(kind === 'pic' && w.grp && c.some(x => x.grp === w.grp)) &&
      !c.some(x => x.ru === w.ru || sameSyn(x, w)));
    if (!c) { c = []; chunks.push(c); }
    c.push(w);
  }
  M = { mode, kind, words, chunks, ci: 0, ok: 0, bad: 0, mistakes: new Set(), skipped: new Set() };
  screen = 'match';
  sessionRail(mode, 0, words.length, 0, 0, '');
  renderMatch();
}

function renderMatch() {
  sayRegistry = [];
  const ch = M.chunks[M.ci];
  const before = M.chunks.slice(0, M.ci).reduce((s, c) => s + c.length, 0);
  let matched = 0;
  setProgress(before, M.words.length);
  const board = matchBoard(ch, M.kind);
  setHTML(`
    <div class="qhead"><span class="prompt">Соедините пары · раунд ${M.ci + 1} из ${M.chunks.length}</span></div>
    ${board.html}
  `);
  board.bind({
    onHit(w) { M.ok++; if (!M.mistakes.has(w)) record(w, true); setScore(M.ok, M.bad); setProgress(before + ++matched, M.words.length); },
    onMiss(w) { M.bad++; if (!M.mistakes.has(w)) record(w, false); M.mistakes.add(w); setScore(M.ok, M.bad); },
    onDone(skipped) {
      skipped.forEach(w => M.skipped.add(w));
      setTimeout(() => {
        if (screen !== 'match') return;
        M.ci++;
        if (M.ci < M.chunks.length) renderMatch();
        else renderResults({ good: M.words.filter(w => !M.mistakes.has(w) && !M.skipped.has(w)).length,
          total: M.words.length, mistakes: [...M.mistakes], unit: 'без ошибок', ok: M.ok, bad: M.bad });
      }, skipped.length ? 0 : 600);
    },
  });
}

// Two-column pairs board. Returns its HTML and bind(callbacks) to call after it is in the page.
// onMiss gets the Romanian word that was matched wrongly.
function matchBoard(words, kind) {
  const left = shuffle(words), right = shuffle(words);
  const html = `<div class="match">
    <div class="col">${left.map((w, i) => `<div class="lrow">${learnBox(w, false)}<button class="mi ro" data-side="L" data-i="${i}">${esc(w.ro)}</button></div>`).join('')}</div>
    <div class="col">${right.map((w, i) => `<button class="mi" data-side="R" data-i="${i}">${
      kind === 'pic' ? `<span class="pr">${picHTML(w, 'xs')}<span>${esc(w.ru)}</span></span>` : esc(w.ru)}</button>`).join('')}</div>
  </div>
  <div class="nextrow">
    <span class="lhint">Галочка слева от слова — «выучено»: пара уходит из раунда, а слово больше не будет попадаться в упражнениях.</span>
    <button class="btn primary" data-act="skip">Дальше ${icon('arrow')}</button>
  </div>`;
  // onDone(skipped): skipped = words left unmatched when "Дальше" was pressed
  const bind = ({ onHit, onMiss, onDone }) => {
    const done = new Set();
    let sel = null, finished = false;
    const finish = skipped => { if (finished) return; finished = true; activeBoard = null; onDone(skipped); };
    const elsOf = w => [left.indexOf(w), right.indexOf(w)].map((i, n) =>
      app.querySelector(`.mi[data-side="${n ? 'R' : 'L'}"][data-i="${i}"]`));
    activeBoard = {
      learned(w) {
        if (!words.includes(w) || done.has(w)) return;
        done.add(w);
        elsOf(w).forEach(el => { el.classList.remove('sel'); el.classList.add('done', 'gone'); });
        if (sel && sel.w === w) sel = null;
        if (done.size === words.length) finish([]);
      },
    };
    app.querySelector('[data-act=skip]').onclick = () => finish(words.filter(w => !done.has(w)));
    app.querySelectorAll('.mi').forEach(el => el.onclick = () => {
      const side = el.dataset.side;
      const w = (side === 'L' ? left : right)[+el.dataset.i];
      if (done.has(w)) return;
      if (side === 'L' && settings.autoplay) Speech.say(w);
      if (!sel || sel.side === side) {
        if (sel) sel.el.classList.remove('sel');
        sel = { side, el, w };
        el.classList.add('sel');
        return;
      }
      const a = sel; sel = null;
      a.el.classList.remove('sel');
      if (a.w === w) {
        done.add(w);
        a.el.classList.add('done'); el.classList.add('done');
        (side === 'R' ? el : a.el).insertAdjacentHTML('beforeend', stamp(true, icon('check'), 'sm land'));
        onHit(w);
        if (done.size === words.length) finish([]);
      } else {
        onMiss(side === 'L' ? w : a.w);
        [a.el, el].forEach(e => { e.classList.add('wrong'); setTimeout(() => e.classList.remove('wrong'), 450); });
      }
    });
  };
  return { html, bind };
}

/* ================= cards ================= */
let cardHide = LS.get('cardHide', 'none');   // 'none' | 'ru' | 'ro'

function renderCards(words, title = 'Карточки') {
  screen = 'cards';
  sayRegistry = [];
  const order = selectedWords();
  const sorted = words.slice().sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const tbtn = (v, label) => `<button class="rbtn ${cardHide === v ? 'on' : ''}" data-hide="${v}" aria-pressed="${cardHide === v}">${label}</button>`;
  setRail(`
    ${brand()}
    <div class="session">
      <div class="mode">${esc(title)}</div>
      <div class="count" style="margin-top:14px">${sorted.length} <small>${plural(sorted.length, 'слово', 'слова', 'слов')}</small></div></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${tbtn('none', 'Показать всё')}${tbtn('ru', 'Скрыть перевод')}${tbtn('ro', 'Скрыть румынский')}
    </div>
    <div class="rnote">Нажмите на размытый текст, чтобы открыть его.</div>
    <div class="rail-foot"><button class="rbtn" data-act="menu">${icon('back')} В меню <kbd>Esc</kbd></button></div>
  `, true);
  setHTML(`
    <div class="cards">
      ${sorted.map((w, i) => {
        const s = stats[w.key];
        return `<article class="card ${isLearned(w) ? 'learned' : ''}" data-key="${esc(w.key)}" style="--c:${topicColor(w.topic)}">
          <div class="top">${hasPic(w) ? picHTML(w, 'card') : `<span class="nopic" aria-hidden="true">${esc(initial(w.ro))}</span>`}</div>
          <div class="body">
            <div class="cro"><span class="${cardHide === 'ro' ? 'hidden-txt' : ''}">${esc(w.ro)}
              ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''}</span>${sayBtn(w, 'sm')}</div>
            <div class="cru ${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.ru)}</div>
            ${w.note ? `<div class="note ${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.note)}</div>` : ''}
            ${w.ex ? `<button class="ex" data-ex="${i}">${icon('speaker')}<span>${esc(w.ex)}<br><span class="${cardHide === 'ru' ? 'hidden-txt' : ''}">${esc(w.exRu || '')}</span></span></button>` : ''}
            <div class="st">${learnBox(w)}${s ? `<span>✓ ${s.c} · ✗ ${s.w}</span>` : ''}</div>
          </div>
        </article>`;
      }).join('')}
    </div>
  `);
  rail.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => {
    cardHide = b.dataset.hide; LS.set('cardHide', cardHide); renderCards(words, title);
  });
  app.querySelectorAll('.hidden-txt').forEach(el => el.onclick = e => { e.stopPropagation(); el.classList.remove('hidden-txt'); });
  app.querySelectorAll('[data-ex]').forEach(el => el.onclick = () => Speech.say({ ro: sorted[+el.dataset.ex].ex }));
}

/* ================= tables ================= */
let tableHide = LS.get('tableHide', false);   // forms blurred for self-check
function renderTables() {
  screen = 'tables';
  sayRegistry = [];
  const tables = selectedTables();
  const cells = [];   // what each form button says: "pronoun form", using the word's own recording
  const cell = (pron, form) => {
    const text = pron.split('/')[0].trim() + ' ' + form;
    cells.push(BY_KEY.get(text) || { ro: text });
    return `<button class="vform" data-cell="${cells.length - 1}" title="Послушать: ${esc(text)}">
      <span class="${tableHide ? 'hidden-txt' : ''}">${esc(form)}</span>${icon('speaker')}</button>`;
  };
  const hbtn = (v, label) => `<button class="rbtn ${tableHide === v ? 'on' : ''}" data-th="${v}" aria-pressed="${tableHide === v}">${label}</button>`;
  setRail(`
    ${brand()}
    <div class="session">
      <div class="mode">Таблицы</div>
      <div class="count" style="margin-top:14px">${tables.length} <small>${plural(tables.length, 'таблица', 'таблицы', 'таблиц')}</small></div></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${hbtn(false, 'Показать всё')}${hbtn(true, 'Скрыть формы')}
    </div>
    <div class="rnote">Нажмите на форму, чтобы послушать её с местоимением${tableHide ? ' и открыть' : ''}.</div>
    <div class="rail-foot"><button class="rbtn" data-act="menu">${icon('back')} В меню <kbd>Esc</kbd></button></div>
  `, true);
  setHTML(tables.map(tb => `
    <section class="vtable" style="--c:${topicColor(tb.topic)}">
      <h2>${esc(tb.title)}</h2>
      <div class="vscroll"><table>
        <thead><tr><td></td>${tb.cols.map(c => `<th scope="col">${esc(c.ro)}<small>${esc(c.ru || '')}</small></th>`).join('')}</tr></thead>
        <tbody>${tb.rows.map(([pron, ...forms]) => `<tr><th scope="row">${esc(pron)}</th>
          ${forms.map(f => `<td>${cell(pron, f)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      ${tb.notes && tb.notes.length ? `<ul class="vnotes">${tb.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    </section>`).join(''));
  rail.querySelectorAll('[data-th]').forEach(b => b.onclick = () => {
    tableHide = b.dataset.th === 'true'; LS.set('tableHide', tableHide); renderTables();
  });
  app.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => {
    b.querySelector('.hidden-txt')?.classList.remove('hidden-txt');
    Speech.say(cells[+b.dataset.cell]);
  });
}

/* ================= results ================= */
function renderResults(r) {
  screen = 'results';
  sayRegistry = [];
  const pct = r.total ? Math.round(r.good / r.total * 100) : 0;
  const gr = grade(pct);
  LS.set('lastResult', { pct, good: r.good, total: r.total, unit: r.unit, at: Date.now() });
  setRail(`
    ${brand()}
    <div class="session">
      <div class="mode">${esc(MODE_NAMES[last.mode] || '')}</div>
      <div class="count" style="margin-top:14px">${r.good} <small>/ ${r.total}</small></div>
      <div class="rprog"><i style="width:${pct}%"></i></div></div>
    <div class="tally">
      <div class="okn"><b>${r.ok}</b><span>${okLabel(r.ok)}</span></div>
      <div class="badn"><b>${r.bad}</b><span>${badLabel(r.bad)}</span></div>
    </div>
    <div class="rail-foot"><button class="rbtn" data-act="menu">${icon('back')} В меню <kbd>Esc</kbd></button></div>
  `, true);
  setHTML(`
    <section class="result">
      ${stamp(gr.ok, esc(gr.g), 'xl land')}
      <div>
        <h1>${esc(gr.name)}</h1>
        <div class="gname">${esc(gr.ru)}</div>
        <div class="score"><b>${r.good}</b> из <b>${r.total}</b> ${esc(r.unit)} · ${pct}%</div>
      </div>
    </section>
    ${r.mistakes.length ? `<h2 class="sec">Стоит повторить</h2><div class="mlist">
      ${r.mistakes.map(w => `<div class="mrow">${picHTML(w, 'xs')}
        <div class="w"><b>${esc(w.ro)}</b> ${w.tr ? `<span class="tr">[${esc(w.tr)}]</span>` : ''}<br>
        <span class="tr" style="font-size:15px">${esc(w.ru)}</span></div>${sayBtn(w, 'sm')}</div>`).join('')}
    </div>` : '<p class="score">Без единой ошибки.</p>'}
    <div class="btns">
      ${r.mistakes.length ? `<button class="btn primary" data-act="retry">Повторить ошибки</button>` : ''}
      <button class="btn ${r.mistakes.length ? '' : 'primary'}" data-act="again">Ещё раз</button>
      <button class="btn" data-act="menu">В меню</button>
    </div>
  `);
  app.querySelector('[data-act=menu]').onclick = renderHome;
  app.querySelector('[data-act=again]').onclick = () => startMode(last.mode, shuffle(last.words));
  const retry = app.querySelector('[data-act=retry]');
  if (retry) retry.onclick = () => {
    // matching needs at least 2 pairs, so pad with random words if only one mistake
    let ws = r.mistakes.slice();
    if (ws.length < 2) ws = ws.concat(shuffle(last.words.filter(w => !ws.includes(w))).slice(0, 3));
    startMode(last.mode, shuffle(ws));
  };
}

/* ================= keyboard ================= */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape' && screen !== 'home') { renderHome(); return; }
  if (screen === 'home' && e.key === 'Enter' && e.target === document.body && practiceWords().length >= 2) {
    startMode('mix', sessionWords()); return;
  }
  const onBoard = screen === 'match' || (screen === 'quiz' && Q.queue[Q.i].type === 'match');
  if (onBoard) {
    if (e.key === 'Enter') { const b = app.querySelector('[data-act=skip]'); if (b) { e.preventDefault(); b.click(); } }
    return;
  }
  if (screen !== 'quiz') return;
  const item = Q.queue[Q.i];
  if (/^[1-9]$/.test(e.key) && !Q.answered) { answer(+e.key - 1); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') && Q.answered) { nextQuestion(); e.preventDefault(); }
  else if (e.code === 'KeyR') Speech.say(item.w);
});

Speech.load();
renderHome();
if (document.fonts) document.fonts.ready.then(fitWords);
</script>
